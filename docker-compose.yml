services:
  analytics:
    build:
      context: .
      dockerfile: analytics-python/Dockerfile
    environment:
      PORT: "5000"
    ports:
      - "5000:5000"
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend-node/Dockerfile
    environment:
      PORT: "3000"
      ANALYTICS_URL: "http://analytics:5000/api/analytics"
    ports:
      - "3000:3000"
    volumes:
      - ./backend-node/data:/app/data
    depends_on:
      - analytics
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend-angular/Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - backend
    restart: unless-stopped
